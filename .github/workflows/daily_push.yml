name: 波奇酱每日推送

on:
  schedule:
    # 每小时的 :05 和 :35 各跑一次，由 main.py 判断当天是否有待补发的推送
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-bocchi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - name: 运行波奇脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
      - name: 提交已发送记录
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sent.txt sent_windows.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新已发送记录"
            git push
          fi

name: 波奇酱每日推送

on:
  schedule:
    # 北京时间 10:00 / 14:00 / 22:00 (UTC 2:00 / 6:00 / 14:00)
    - cron: '0 2,6,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-bocchi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    - run: pip install -r requirements.txt
    - name: 运行波奇脚本
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      run: python main.py
    - name: 提交已发送记录
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        if [ -f sent.txt ]; then
          git add sent.txt
          git diff --cached --quiet || git commit -m "记录已发送图片"
          git push
        fi

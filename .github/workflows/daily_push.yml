  name: 波奇酱每日推送

  on:
    schedule:
      - cron: '0 2,6,14 * * *'
    workflow_dispatch:

  jobs:
    send-bocchi:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - name: 运行波奇脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
